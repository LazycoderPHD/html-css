<!DOCTYPE html>
<html>
    <head>
        <title>My forms</title>
    </head>
    <body>
        <h1 style = "text-align: center;">Job application</h1>
        <!-- action = send data to [] site, post for pass get for data -->
         <form action="index.php" method = "POST" enctype = "multipart/form-data">

            <label for ="username">username:</label>
            <input type ="text" id = "username" placeholder="Nguyen Van A" minlength="5" maxlength="15" required>

            <br>
            <label for ="password">password:</label>
            <input type ="password" id ="password" minlength = "6" maxlength ="30" required></input>
            
            <br>
            <label for ="email">email:</label>
            <input type ="email" id = "email" placeholder="dogperson@gmail.com" minlength="5" maxlength="15" required>

            <br>
            <label for ="phone">phone: </label>
            <input type ="tel" id = "phone" placeholder ="012-3456-789" pattern="[0-9]{3}-[0-9]{4}-[0-9]{3}" minlength = "10" required>

            <br>
            <label for ="birthday">birthday:</label>
            <input type ="date" id = "birthday">
            
            <br>
            <label for ="quantity">quantity:</label>
            <input type ="number" id = "quantity" min = "1" max = "100" value = "1">

            <br>
            <label for ="Mr.">Mr.</label>
            <input type ="radio" id = "Mr." value = "Mr." name = "title">
            <label for ="Ms.">Ms.</label>
            <input type ="radio" id = "Ms." value = "Ms." name = "title">
            <label for ="PhD.">PhD.</label>
            <input type ="radio" id = "PhD." value = "PhD." name = "title">
            <label for="none">None</label>
            <input type="radio" id="none" value="None" name="title">
            
            <br>
            <label for ="payment">payment:</label>
            <select id = "payment">
                <option value = "credit card">visa</option>
                <option value = "paypal">paypal</option>
                <option value = "cash">momo</option>
            </select>
            
            <br>
            <label for ="subscribe">subscribe:</label>
            <input type ="checkbox" id ="subscribe" value = "subscribe">

            <br>
            <label for ="comment">comment:</label>
            <textarea id = "comment" rows = "3" cols = "25" placeholder="write your comment here"></textarea>

            <br>
            <label for ="file">file:</label>
            <input type ="file" id = "file" accept = ".jpg, .png, .jpeg, .pdf">

            <br>
            <input type ="submit">
            <br>
            <input type = "reset">
         </form>
    </body>
</html>
